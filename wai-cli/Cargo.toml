[package]
name = "wai-cli"
version = "0.1.0"
edition = "2024"
description = "Web App Installer for Linux - transform web apps into native desktop applications"
license = "MIT"

[dependencies]
dialoguer = "0.10"
console = "0.15"
ureq = "2.9"
dirs = "5.0"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[package.metadata.deb]
name = "wai"
maintainer = "DevEnDev-Team <devendev.pro@gmail.com>"
assets = [
    ["../target/release/wai-cli", "usr/bin/wai", "755"],
    ["../target/release/wai-runner", "usr/bin/wai-runner", "755"]
]
depends = "libwebkit2gtk-4.1-0, libgtk-3-0, libsoup-3.0-0, libssl3, libayatana-appindicator3-1, librsvg2-common"
